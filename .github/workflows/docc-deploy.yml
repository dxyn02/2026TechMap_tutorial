name: Deploy DocC to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -project CookieDungeon.xcodeproj \
            -scheme CookieDungeon \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DOCC_HOSTING_BASE_PATH="${{ github.event.repository.name }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find and transform DocC archive
        run: |
          ARCHIVE_PATH="$(
            find "$RUNNER_TEMP/DerivedData/Build/Products" \
              -type d \
              -name 'CookieDungeon.doccarchive' \
              -print \
              -quit
          )"

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "::error::CookieDungeon.doccarchive를 찾지 못했습니다."
            find "$RUNNER_TEMP/DerivedData/Build/Products" \
              -maxdepth 4 \
              -print
            exit 1
          fi

          echo "DocC archive: $ARCHIVE_PATH"

          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --hosting-base-path "${{ github.event.repository.name }}" \
            --output-path "$RUNNER_TEMP/docc-site"

      - name: Verify generated site
        run: |
          INDEX_PATH="$RUNNER_TEMP/docc-site/index.html"
          EXPECTED_BASE="/${{ github.event.repository.name }}/"

          if [ ! -f "$INDEX_PATH" ]; then
            echo "::error::생성된 사이트에 index.html이 없습니다."
            exit 1
          fi

          if ! grep -Fq "var baseUrl = \"$EXPECTED_BASE\"" "$INDEX_PATH"; then
            echo "::error::DocC hosting base path가 index.html에 적용되지 않았습니다."
            grep -o 'var baseUrl = [^<]*' "$INDEX_PATH" || true
            exit 1
          fi

          echo "Verified DocC base path: $EXPECTED_BASE"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/docc-site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

